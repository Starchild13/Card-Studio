# Gradle Version Catalog for Card Studio Android application.
# Centralizes version declarations, library artifacts, and Gradle plugin references.

[versions]
# Core AndroidX and Kotlin version definitions
activityCompose = "1.13.0"
agp = "9.5.1"
coilCompose = "2.7.0"
coreKtx = "1.19.1"
espressoCore = "3.7.0"
junit = "1.3.0"
junitVersion = "4.13.2"
kotlin = "2.4.21"
ksp = "2.3.6"
lifecycleRuntimeKtx = "2.11.0"
material = "1.12.1"
materialIconsExtended = "1.7.8"
room = "2.8.5"
ui = "1.12.1"

[libraries]
# AndroidX Core, Activity, & Lifecycle libraries
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# Jetpack Compose UI & Material Design libraries
androidx-material = { group = "androidx.compose.material", name = "material", version.ref = "material" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "ui" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "ui" }

# Jetpack Room Persistence Database libraries
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

# Coil Image loading & Animated GIF decoding libraries
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coilCompose" }

# Testing libraries (JUnit, Espresso, Compose UI Test)
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "ui" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "ui" }
junit = { group = "junit", name = "junit", version.ref = "junitVersion" }

[plugins]
# Gradle build plugins
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
