// Top-level build configuration file for Card Studio Android project.
// Defines plugin aliases applied across sub-projects and modules.
plugins {
    // Android application plugin definition
    alias libs.plugins.android.application apply false
    // Android library plugin definition
    alias libs.plugins.android.library apply false
    // Jetpack Compose compiler plugin definition
    alias libs.plugins.compose.compiler apply false
    // Kotlin Symbol Processing (KSP) plugin definition for Room annotation processing
    alias libs.plugins.ksp apply false
}
